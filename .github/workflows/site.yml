name: Update site

# GitHub Pages serves this branch as-is ("Deploy from a branch", main / root):
#   /         -> index.html          (the app, wasm inlined; generated by web/build.sh)
#   /readme/  -> readme/README.md    (documentation, rendered by Pages)
# This job rebuilds index.html whenever the sources change and commits it if it differs.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: site
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build index.html
        run: bash ./web/build.sh
      - name: Commit index.html if it changed
        id: commit
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html is up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild index.html from ${GITHUB_SHA::7}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Pushes made with GITHUB_TOKEN may not start a Pages build on their own.
      - name: Request a Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Pages build request failed (is Pages enabled?)"
