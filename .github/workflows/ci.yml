name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.features }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: [default, no-nvidia]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}

      - name: Feature flags
        shell: bash
        run: |
          if [ "${{ matrix.features }}" = "no-nvidia" ]; then
            echo "FLAGS=--no-default-features" >> "$GITHUB_ENV"
          else
            echo "FLAGS=" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: cargo build --all-targets ${{ env.FLAGS }}
      - name: Test
        run: cargo test ${{ env.FLAGS }}
      - name: Timing test (alone, nothing else running)
        run: cargo test ${{ env.FLAGS }} --lib -- --ignored --test-threads=1
      - name: Clippy
        run: cargo clippy --all-targets ${{ env.FLAGS }} -- -D warnings
      - name: Smoke test (no terminal needed)
        run: |
          cargo run --release ${{ env.FLAGS }} -- --print-config
          cargo run --release ${{ env.FLAGS }} -- --config config.example.toml --snapshot 80x24
          cargo run --release ${{ env.FLAGS }} -- --list solids
          cargo run --release ${{ env.FLAGS }} -- --list sensors
          cargo run --release ${{ env.FLAGS }} -- --list patterns
          cargo run --release ${{ env.FLAGS }} -- --snapshot 80x24 --snapshot-time 5 --bg-pattern hex --bg-scroll 0.5:0 --bg-rotate ccw
          cargo run --release ${{ env.FLAGS }} -- --snapshot 80x24 --bg-lum 0
          cargo run --release ${{ env.FLAGS }} -- --snapshot 120x40 --wireframe --legend-size 4 --legend-pos br --legend-opacity 1
          cargo run --release ${{ env.FLAGS }} -- --snapshot 120x40 --layout sphere --camera focus --snapshot-time 4 --color-by load --legend
          cargo run --release ${{ env.FLAGS }} -- --snapshot 80x24 --color "#000:#f80:#fff" --color-depth 256 --fps-invert
          cargo run --release ${{ env.FLAGS }} -- --list gradients
          cargo run --release ${{ env.FLAGS }} -- --snapshot 80x24 --camera orbit --aspect uwqhd --show cpu,ram,disk,net,gpu,nic,disk-dev --ring nic=1 --solid cpu=truncated-icosahedron
      - name: Release build
        run: cargo build --release ${{ env.FLAGS }}
      - uses: actions/upload-artifact@v4
        if: matrix.features == 'default'
        with:
          name: platomon-${{ matrix.os }}
          path: |
            target/release/platomon
            target/release/platomon.exe
          if-no-files-found: ignore

  web:
    name: web (wasm32 build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p platomon-web
      - run: cargo clippy -p platomon-web -p platomon --lib --target wasm32-unknown-unknown -- -D warnings
      - run: pwsh ./web/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: platomon-web
          path: web/dist/index.html

  bench:
    name: bench (ubuntu, compile + quick run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --bench render -- --warm-up-time 1 --measurement-time 3
