[package]
name = "platomon"
version = "1.3.0"
edition = "2024"
description = "Platonic-solid ASCII system monitor: five path-traced solids, one per resource"
license = "MIT OR Apache-2.0"

[features]
default = ["nvidia"]
nvidia = ["dep:nvml-wrapper"]

[workspace]
members = [".", "web"]

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
fastrand = "2.5.0"
glam = "0.34.3"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

# Terminal, OS sensors and threads: native only. The browser build
# (web/, wasm32) renders single-threaded from a simulated load sequence.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossterm = "0.29.0"
dirs = "7.0.0"
nvml-wrapper = { version = "0.13.0", optional = true }
rayon = "1.12.0"
sysinfo = { version = "0.40.4", default-features = false, features = ["system", "disk", "network", "gpu"] }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "render"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
