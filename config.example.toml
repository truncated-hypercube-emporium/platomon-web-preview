show = [
    "cpu",
    "ram",
    "disk",
    "net",
    "gpu",
]
# Per-solid inputs instead of `show` (max 12): "SHAPE|SIZE|SPIN|COLOUR|COMPLEXITY",
# each input a metric, "delta:METRIC" (its change over delta_period seconds) or "off".
# bindings = ["auto|cpu", "cube|ram|delta:ram|ram|off", "auto|delta:net|net|net|cpu"]
bindings = []
delta_period = 10.0
fps_min = 5.0
fps_max = 150.0
fps_curve = "sqrt"
fps_slew = 60.0
fps_invert = false
spp = 2
bounces = 2
max_steps = 64
max_dist = 50.0
adaptive_quality = true
ramp = " .,:;-~=+*ox#%&@"
char_aspect = 0.5
exposure = 1.0
show_stats = false
aspect = "fill"
aspect_mode = "letterbox"
legend = false
legend_size = 2
legend_opacity = 0.85
legend_pos = "top-left"
wireframe = false
tags = false              # metric tag that follows each solid (key t)
tag_color = "complement"  # theme | complement | white | "#RRGGBB" (with a gradient)
tag_blocks = false        # three-row block letters for small fonts
color = "off"
color_by = "lum"         # lum | load | spin
colors = 16              # palette size: 16 | 32 | 64 | 128
bg_color = "auto"        # auto | off | match | a gradient (background, by brightness)
color_reverse = false
layout = "rings"
camera = "static"
orbit_period = 60.0
orbit_dir = "random"
orbit_bob = 0.3
focus_zoom = 0.6
focus_tau = 1.5
bg_lum = 5.0
bg_pattern = "solid"
bg_contrast = 0.5
bg_scale = 1.0
bg_scroll = [
    0.0,
    0.0,
]
bg_sway = 0.0
bg_sway_period = 10.0
bg_rotate = "off"
bg_rotate_period = 60.0
bg_waves = 7              # quasicrystal: plane waves, 3..24
bg_wave_speed = 0.6       # flow of the animated patterns (quasicrystal, radians/s, 0 = still; rain, ocean, julia, clouds in proportion)
bg_drops = 12             # rain: raindrops rippling at once, 1..48
bg_ripple = 0.9           # rain: distance between ripples, tiles
bg_drop_life = 4.5        # rain: seconds a drop's rings last
bg_wind = 30.0            # ocean: wind direction, degrees
bg_chop = 0.6             # ocean: crest sharpness, 0 = plain sine waves
bg_julia_iter = 28        # julia: iterations (edge detail)
bg_julia_shape = 0.7885   # julia: radius of the circle its constant drifts round
bg_carpet_levels = 5      # carpet: sizes of square cut out
bg_octaves = 5            # clouds: noise octaves
bg_roughness = 0.5        # clouds: each finer octave's strength
bg_sectors = 12           # radial: sectors round the focal point
bg_dot_size = 0.5         # polka: dot size across, tiles
bg_dot_spacing = 1.0      # polka: distance between neighbouring dots, tiles
bg_dot_variability = 0.0  # polka: how much dot sizes and places vary, 0..1
bg_invert_half = false    # polka: invert one side of a line through the centre
min_scale = 0.45
max_scale = 1.0
max_spin = 3.0
idle_spin = 0.15
smoothing_tau = 0.35
poll_hz = 4.0
rate_floor_bytes = 1000000.0
peak_decay_per_sec = 0.01

[solids]

[rings]

[weights]
cpu = 1.0
ram = 1.0
disk = 1.0
net = 1.0
gpu = 1.0
nic = 1.0
disk_dev = 1.0
